##
# OpenRiC Service — ric.theahg.co.za
#
# Separate-deployment of the RiC API (extracted from Heratio's ahg-ric
# package). Shares Heratio's MySQL during Phase 4.3 Option A; will move
# to its own DB in Phase 4.3 Option B.
#
# After installing:
#   1. Save this file as /etc/nginx/sites-available/ric.theahg.co.za.conf
#   2. ln -s ../sites-available/ric.theahg.co.za.conf /etc/nginx/sites-enabled/
#   3. Ensure DNS A record ric.theahg.co.za → this host (or CNAME to heratio.theahg.co.za)
#   4. certbot --nginx -d ric.theahg.co.za  (OR reuse the theahg.co.za wildcard cert)
#   5. nginx -t && systemctl reload nginx
##

server {
    listen 80;
    listen [::]:80;
    server_name ric.theahg.co.za;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ric.theahg.co.za;

    root /usr/share/nginx/openric-service/public;
    index index.php;

    # Reuse the same Let's Encrypt cert as heratio.theahg.co.za
    # (the cert already covers theahg.co.za; confirm it covers ric. as well
    # with `openssl x509 -in … -text -noout | grep DNS:` — if not, run
    # certbot --expand -d ric.theahg.co.za against the existing cert).
    ssl_certificate     /etc/letsencrypt/live/theahg.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theahg.co.za/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/ric_access.log;
    error_log  /var/log/nginx/ric_error.log;

    # Security headers
    add_header X-Frame-Options        "DENY"                          always;
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # CORS is handled by the Laravel api.cors middleware on the RiC routes —
    # do NOT add Access-Control-Allow-* here, it would double up.

    # Block common exploit paths
    location ~* (\.env|\.git|phpunit|thinkphp) { return 444; }

    # Static + Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Generous timeout for SPARQL / graph queries.
        fastcgi_read_timeout 60;
    }

    # No static assets to cache; everything is JSON-LD. Keep it simple.
    location ~* /\.(?!well-known).* { deny all; }
}
