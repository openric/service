##
# ric.theahg.co.za
# - Static landing at / (public/index.html — one page, four tiles)
# - Laravel OpenRiC API service at /api/ric/v1/*
#
# Phase 4.4 consolidation: the former Flask community site (landing /
# docs / explorer / login on port 5055) has been retired. The spec + docs
# live at openric.org; the community conversation is on GitHub
# Discussions (github.com/openric/spec/discussions). This host is the
# reference API only.
#
# Apply:
#   sudo cp /usr/share/nginx/OpenRiC/deploy/ric.theahg.co.za.conf /etc/nginx/sites-available/
#   sudo nginx -t && sudo systemctl reload nginx
#   # optional: stop the now-unused Flask service
#   sudo systemctl stop ric-site 2>/dev/null || true
#
# Verify:
#   curl -sI https://ric.theahg.co.za/                          # 200 text/html (static)
#   curl -sI https://ric.theahg.co.za/api/ric/v1/health         # 200 application/json
##

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name ric.theahg.co.za;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ric.theahg.co.za;

    ssl_certificate         /etc/letsencrypt/live/theahg.co.za/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/theahg.co.za/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/theahg.ddns.net/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers on;

    charset utf-8;

    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/ric_access.log;
    error_log  /var/log/nginx/ric_error.log;

    # Document root for the static landing + Laravel front controller.
    root /usr/share/nginx/OpenRiC/public;
    index index.html index.php;

    # ---------- Static landing at / ----------
    location = / {
        try_files /index.html =404;
    }

    # ---------- Laravel OpenRiC API at /api/ric/v1/* ----------
    location /api/ric/v1 {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---------- Entity-path redirects to the human frontend ------
    # /informationobject/{slug}, /actor/{slug}, /place/{id}, etc. — these
    # are what JSON-LD @id values point at. Laravel's routes/web.php does
    # content negotiation: browsers → OPENRIC_FRONTEND_URL (heratio), machine
    # clients (Accept: application/ld+json) → the API endpoint.
    location ~ ^/(informationobject|actor|repository|place|rule|activity|instantiation|function)(/|$) {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Back-compat redirects from the retired Flask site — every meaningful
    # old URL goes to its canonical new home. Harmless 301s.
    location = /docs        { return 301 https://openric.org/; }
    location = /whats-new   { return 301 https://github.com/openric/spec/discussions; }
    location = /explorer    { return 301 https://viewer.openric.org/; }
    location = /login       { return 301 https://openric.org/; }
    location = /register    { return 301 https://openric.org/; }
    location /ric-api/      { return 301 /api/ric/v1/; }
    location = /sparql      { return 301 /api/ric/v1/sparql$is_args$args; }
    location = /oai         { return 301 /api/ric/v1/oai$is_args$args; }

    # User-uploaded content — served directly off disk for speed. The upload
    # endpoint at /api/ric/v1/upload writes here; this location makes the
    # files publicly fetchable (for embedding in viewers, IIIF, etc.).
    location /uploads/ {
        alias /usr/share/nginx/OpenRiC/storage/app/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Thumbnails are a derivative cache — long-cacheable, public.
    # Generated on first request by /api/ric/v1/thumbnail/{id}; subsequent
    # requests hit the file directly.
    location /thumbnails/ {
        alias /usr/share/nginx/OpenRiC/storage/app/thumbnails/;
        autoindex off;
        expires 365d;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Allow upload size up to 100 MB to match the controller's default max.
    client_max_body_size 100M;

    # Only explicit .php requests reach PHP-FPM.
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    # Deny dotfiles (beyond /.well-known for ACME)
    location ~ /\.(?!well-known).* { deny all; }
}
